<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starter scene · HeyDoc Design System</title>
<!-- Copy this file to start a new animated scene. Everything is driven by render(t): a pure function of time.
     Scrub with the bar, ←/→ step a frame (Shift = 1s), Space play/pause, ?t=3.2 opens at 3.2s.
     Try ?brand=%23246B45 to see a partner accent applied to the same scene. -->
<link rel="stylesheet" href="../css/heydoc.css">
<style>
  .s-head{position:absolute;left:120px;right:120px;bottom:120px;text-align:center}
  .s-head .hd-headline{font-size:var(--t-scene)}
  .s-head em{color:var(--partner-ink)}
  .s-chips{position:absolute;left:0;right:0;top:640px;display:flex;gap:20px;justify-content:center}
  .s-chips .hd-chip{opacity:0}
  .s-ag{--agent-w:360px}
  .hd-shell__orb{background:var(--partner-orb)}
</style></head>
<body>
<div class="hd-viewport"><div class="hd-stage" id="stage">
  <div class="hd-world">
    <div class="hd-shell" id="core"><div class="hd-shell__bg"></div><div class="hd-shell__orb"></div>
      <div class="hd-shell__clip"><div class="hd-shell__content"><div class="s-ag"><div class="hd-agent is-active"><div class="hd-agent__head"><span class="hd-well hd-well--aqua "><svg class="hd-icon " viewBox="0 0 24 24" style="width:54%;height:54%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.5L4.8 18.3A1.8 1.8 0 0 0 6.4 21h11.2a1.8 1.8 0 0 0 1.6-2.7L14 9.5V3"/><path d="M7.5 15h9"/></svg></span><div><div class="hd-agent__name">Lab Ops agent</div><div class="hd-agent__role">Samples, TAT, reports</div></div></div><div class="hd-agent__status"><span class="hd-agent__dot"></span>Active</div><div class="hd-agent__task">Tracking <b>312 samples</b>, 4 at risk</div><div class="hd-progress hd-progress--thin"><div class="hd-progress__fill" style="--p:55%"></div></div></div></div></div></div></div>
  </div>
  <div class="s-chips"><span class="hd-chip"><span class="hd-well hd-well--lav "><svg class="hd-icon " viewBox="0 0 24 24" style="width:54%;height:54%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 10h8M8 13h5"/></svg></span>Answers 24/7</span><span class="hd-chip"><span class="hd-well hd-well--peach "><svg class="hd-icon " viewBox="0 0 24 24" style="width:54%;height:54%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/></svg></span>Books the test</span><span class="hd-chip"><span class="hd-well hd-well--aqua "><svg class="hd-icon " viewBox="0 0 24 24" style="width:54%;height:54%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4M9 18v-3M12 18v-6M15 18v-4"/></svg></span>Explains the report</span></div>
  <div class="s-head"><div class="hd-headline"><span class="w">One</span> <span class="w">agent</span> <span class="w">per</span> <span class="w"><em>step</em></span> <span class="w"><em>of</em></span> <span class="w"><em>care.</em></span></div></div>
</div></div>
<script src="../js/motion.js"></script><script src="../js/brand.js"></script>
<script>
const {P,EASE,lerp,bump,inOut,words,pop,ring,shell,applyShell}=HD;
const q=new URLSearchParams(location.search);if(q.get('brand'))HDBrand.apply(q.get('brand'));
const rgb=getComputedStyle(document.documentElement).getPropertyValue('--partner-rgb').trim();
const core=shell(document.getElementById('core')),card=document.querySelector('.s-ag .hd-agent');
const W=document.querySelectorAll('.s-head .w'),C=document.querySelectorAll('.s-chips .hd-chip');
const AW=360,AH=card.offsetHeight||236;
/* timeline (seconds) — keep beats as named constants */
const APPEAR=.3, MORPH=1.6, CHIPS=3.0, HEAD=3.4, RING=4.6, OUT=7.2;
function coreState(t){
  const s=P(t,APPEAR,.5,EASE.spring), m=P(t,MORPH,.9,EASE.soft), beat=bump(t,1.1,.35);
  return {x:0,y:-140,w:lerp(96,AW,m),h:lerp(96,AH,m),r:lerp(48,24,m),s:s*(1+.08*beat)*(1-.1*P(t,OUT,.5,EASE.in)),
          op:1-P(t,OUT,.5,EASE.in),orb:1-P(t,MORPH+.1,.35),bg:1,cop:P(t,MORPH+.35,.45),cb:8*(1-P(t,MORPH+.35,.45)),
          ring:46*EASE.out(Math.min(1,Math.max(0,(t-1.1)/.8))),ringA:t>1.1&&t<1.9?.3*(1-(t-1.1)/.8):0,ringRGB:rgb};
}
function render(t){
  applyShell(core,coreState(t),coreState(t-1/60));
  C.forEach((c,i)=>{pop(c,t,CHIPS+i*.12);c.style.opacity=+c.style.opacity*(1-P(t,OUT,.4,EASE.in))});
  words(W,t,HEAD,OUT);
  ring(card,t,RING,rgb);
}
HD.player({duration:8.5,render,stage:'#stage',markers:[[0,'in'],[MORPH,'morph'],[HEAD,'text'],[OUT,'out']]});
</script>
</body></html>
